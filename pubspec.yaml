name: senicare
description: "SeniCare — lembretes de medicamentos para o público sênior: alarme na hora certa, histórico de doses e relatório de adesão, 100% offline."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado e dados
  flutter_riverpod: ^3.0.0
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  path: ^1.9.1

  # Alarmes e notificações
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.10

  # Interface e recursos do aparelho
  intl: ^0.20.2
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  sqlite3: ^3.5.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/data/medicamentos_br.json
    - assets/branding/selo.png
    - assets/fonts/OFL-GreatVibes.txt

  # Fonte EMBUTIDA no app (antes era baixada da internet pelo google_fonts
  # e, sem conexão, aparecia a fonte padrão no lugar).
  fonts:
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf

# Ícone do app: o "S" caligráfico branco sobre o azul da marca.
# Gerar com:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icone.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/branding/icone_frente.png"
  adaptive_icon_monochrome: "assets/branding/icone_frente.png"

# Splash nativa (aparece enquanto o app carrega).
# Gerar com:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0B1220"
  image: "assets/branding/splash_selo.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#0B1220"
    image: "assets/branding/splash_android12.png"
  android: true
  ios: true
  web: false
