# Integração contínua do SeniCare: a cada push / pull request, garante que
# o código analisa sem avisos, os testes passam, o código gerado do banco
# (Drift) está atualizado e o APK compila.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Mesmo requisito de gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Código gerado do banco está atualizado
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database.g.dart

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análise estática
        run: flutter analyze --fatal-infos

      - name: Testes
        run: flutter test

      - name: Build (APK debug)
        run: flutter build apk --debug
